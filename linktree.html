<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FullCheck Pro | Links</title>
    <meta name="description" content="FullCheck Pro - Links para contato, download e redes sociais.">
    <link rel="icon" type="image/png" href="../icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366F1;
            --primary-dark: #4F46E5;
            --primary-light: #818CF8;
            --secondary: #8B5CF6;
            --success: #25D366;
            --text-dark: #1E293B;
            --text-medium: #475569;
            --text-light: #64748B;
            --bg-white: #FFFFFF;
            --bg-light: #F8FAFC;
            --bg-subtle: #F1F5F9;
            --gradient-primary: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            --gradient-bg: linear-gradient(180deg, #F8FAFC 0%, #EEF2FF 50%, #F8FAFC 100%);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--gradient-bg);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            overflow-x: hidden;
        }

        /* Background decorations */
        .bg-decoration {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .bg-circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
        }

        .bg-circle-1 {
            width: 400px;
            height: 400px;
            background: rgba(99, 102, 241, 0.15);
            top: -100px;
            right: -100px;
            animation: float1 20s ease-in-out infinite;
        }

        .bg-circle-2 {
            width: 300px;
            height: 300px;
            background: rgba(139, 92, 246, 0.12);
            bottom: -50px;
            left: -50px;
            animation: float2 25s ease-in-out infinite;
        }

        .bg-circle-3 {
            width: 200px;
            height: 200px;
            background: rgba(6, 182, 212, 0.1);
            top: 40%;
            left: 20%;
            animation: float3 18s ease-in-out infinite;
        }

        @keyframes float1 {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(-30px, 30px) scale(1.1);
            }
        }

        @keyframes float2 {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(40px, -20px) scale(1.05);
            }
        }

        @keyframes float3 {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(-20px, -30px) scale(1.15);
            }
        }

        /* Container */
        .container {
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 1;
        }

        /* Profile Section */
        .profile {
            text-align: center;
            margin-bottom: 2.5rem;
            animation: fadeInDown 0.6s ease-out;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .avatar-container {
            position: relative;
            display: inline-block;
            margin-bottom: 1.5rem;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid white;
            box-shadow: 0 15px 50px rgba(99, 102, 241, 0.25),
                0 5px 15px rgba(0, 0, 0, 0.08);
        }

        .avatar-ring {
            position: absolute;
            inset: -6px;
            background: var(--gradient-primary);
            border-radius: 50%;
            z-index: -1;
            animation: rotate 8s linear infinite;
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .profile-name {
            font-size: 1.75rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .profile-tagline {
            color: var(--text-light);
            font-size: 0.95rem;
            font-weight: 500;
        }

        /* Links Container */
        .links {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        /* Link Button */
        .link-btn {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1.25rem 1.5rem;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04),
                0 1px 3px rgba(0, 0, 0, 0.05);
            animation: fadeInUp 0.6s ease-out backwards;
        }

        .link-btn:nth-child(1) {
            animation-delay: 0.1s;
        }

        .link-btn:nth-child(2) {
            animation-delay: 0.2s;
        }

        .link-btn:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .link-btn:hover {
            background: rgba(255, 255, 255, 0.95);
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 20px 40px rgba(99, 102, 241, 0.15),
                0 8px 20px rgba(0, 0, 0, 0.08);
        }

        .link-btn:active {
            transform: translateY(-2px) scale(1.01);
        }

        .link-icon {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        .link-icon svg {
            width: 26px;
            height: 26px;
            fill: white;
        }

        .link-content {
            flex: 1;
        }

        .link-title {
            display: block;
            font-weight: 700;
            font-size: 1.05rem;
            margin-bottom: 0.2rem;
            color: var(--text-dark);
        }

        .link-subtitle {
            font-size: 0.8rem;
            color: var(--text-light);
            font-weight: 500;
        }

        .link-arrow {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-subtle);
            border-radius: 50%;
            opacity: 0.7;
            transition: all 0.3s ease;
        }

        .link-btn:hover .link-arrow {
            opacity: 1;
            background: var(--gradient-primary);
            transform: translateX(4px);
        }

        .link-btn:hover .link-arrow svg {
            stroke: white;
        }

        .link-arrow svg {
            width: 16px;
            height: 16px;
            stroke: var(--text-medium);
            fill: none;
            stroke-width: 2.5;
        }

        /* Icon backgrounds */
        .icon-whatsapp {
            background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
        }

        .icon-download {
            background: var(--gradient-primary);
        }

        .icon-website {
            background: linear-gradient(135deg, #06B6D4 0%, #0891B2 100%);
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 3rem;
            animation: fadeInUp 0.6s ease-out 0.4s backwards;
        }

        .footer-text {
            color: var(--text-light);
            font-size: 0.8rem;
            font-weight: 500;
        }

        .footer-text a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .footer-text a:hover {
            color: var(--primary-dark);
        }

        /* Mobile Responsiveness */
        @media (max-width: 480px) {
            body {
                padding: 1.5rem;
            }

            .avatar {
                width: 100px;
                height: 100px;
            }

            .profile-name {
                font-size: 1.5rem;
            }

            .link-btn {
                padding: 1rem 1.25rem;
            }

            .link-icon {
                width: 46px;
                height: 46px;
            }

            .link-title {
                font-size: 0.95rem;
            }

            .bg-circle-1 {
                width: 250px;
                height: 250px;
            }

            .bg-circle-2 {
                width: 200px;
                height: 200px;
            }
        }
    </style>
</head>
